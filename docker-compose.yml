services:
  # ── LLM serving (GPU, continuous batching for concurrent calls) ──────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - --model=${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      # 0.40 of 16GB = 6.4GB: ~4.7GB weights + ~1.7GB KV, enough for one full
      # 8k-token context (~1.1GB KV) + headroom. The T4 is shared with Whisper
      # (~2.6GB) and Chatterbox fp16 (~3.4GB+ gen spike); 0.55 left <1GB spare
      # and calls OOM'd during simultaneous ASR+TTS. max-num-seqs=2 matches
      # real usage (voice agent is single-call) so vLLM doesn't over-reserve.
      - --gpu-memory-utilization=0.40
      - --max-model-len=8192
      - --max-num-seqs=2
      # Cap the KV cache at ~2GiB (~16k tokens = 2 full 8k contexts) so
      # vLLM's process-level GPU footprint drops from ~9.5GB to ~7.5GB,
      # leaving Whisper + Chatterbox room on the shared 16GB T4. vLLM's
      # default let the cache grow to 3.66GiB+ and the resulting total
      # (15.5GB+) left whisper no memory and OOM'd mid-call.
      - --kv-cache-memory=2147483648
      - --quantization=awq
      - --dtype=auto
      - --port=8001
      - --enforce-eager
    ports:
      - "8001:8001"
    volumes:
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Local Redis (replaces Upstash) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # ── Voice agent (dev: hot reload) ────────────────────────────────────
  voice-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: voice-agent-dev
    runtime: nvidia
    env_file: .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-distil-large-v3}
      - VLLM_BASE_URL=http://vllm:8001/v1
      - REDIS_URL=redis://redis:6379
      - LLM_MODEL=${LLM_MODEL:-hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4}
    ports:
      - "8080:8080"
    depends_on:
      - vllm
      - redis
    volumes:
      - model-cache:/root/.cache
      - piper-models:/models/piper
      - chatterbox-voices:/models/chatterbox/voices
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/azureuser/ar-voice-agent:/project
    profiles: [dev]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Voice agent (prod: baked-in code) ────────────────────────────────
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: voice-agent
    restart: unless-stopped
    runtime: nvidia
    env_file: .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-distil-large-v3}
      - VLLM_BASE_URL=http://vllm:8001/v1
      - REDIS_URL=redis://redis:6379
      - LLM_MODEL=${LLM_MODEL:-hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4}
    ports:
      - "8080:8080"
    depends_on:
      - vllm
      - redis
    volumes:
      - model-cache:/root/.cache
      - piper-models:/models/piper
      - chatterbox-voices:/models/chatterbox/voices
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/azureuser/ar-voice-agent:/project
    profiles: [prod]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Chatterbox TTS (voice cloning) — ISOLATED service ───────────────
  # Runs in its own container with its own transformers 5.2.0 env, because
  # chatterbox-tts hard-pins transformers 5.2.0 which breaks Kokoro (needs
  # transformers 4.x) in the main voice-agent process. The app calls it over
  # HTTP. Voices are recorded in Settings and stored in the shared
  # chatterbox-voices volume, which both containers mount.
  chatterbox-tts:
    build:
      context: ./chatterbox_service
      dockerfile: Dockerfile
    container_name: chatterbox-tts
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CHATTERBOX_DEVICE=cuda
      - CHATTERBOX_VOICES_DIR=/models/chatterbox/voices
    ports:
      - "8082:8082"
    volumes:
      - chatterbox-voices:/models/chatterbox/voices
    profiles: [prod]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Next.js UI (new admin dashboard) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_SCHEME:-https}://${PUBLIC_DOMAIN:-call.ar-voice.com}
        NEXT_PUBLIC_OPIK_HOST: https://optik.${PUBLIC_DOMAIN:-call.ar-voice.com}
    container_name: frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE=${PUBLIC_SCHEME:-https}://${PUBLIC_DOMAIN:-call.ar-voice.com}
      - NEXT_PUBLIC_OPIK_HOST=https://optik.${PUBLIC_DOMAIN:-call.ar-voice.com}
    ports:
      - "3000:3000"
    profiles: [prod, tls]

  # ── TLS termination (Twilio requires HTTPS webhook + WSS stream) ─────
  # Point a DNS A record at the VM IP and set PUBLIC_DOMAIN in .env.
  # Only runs when the `tls` profile is enabled:
  #   docker compose --profile prod --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    depends_on:
      - frontend
    profiles: [tls]

  # ── Opik (LLM evaluation: tracing, playground, optimization) ─────────
  # Run with: docker compose --profile opik up -d
  # UI: http://<host>:5173 · API: http://<host>:8082
  opik-redis:
    image: redis:7-alpine
    container_name: opik-redis
    restart: unless-stopped
    profiles: [opik]

  opik-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: opik-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: opik
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - opik-clickhouse:/var/lib/clickhouse
    ulimits:
      nofile: 262144
      nproc: 8192
      memlock: -1
    profiles: [opik]

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:latest
    container_name: opik-backend
    restart: unless-stopped
    ports:
      - "8082:8080"  # remapped (8080 is used by voice-agent)
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://opik-backend:8080"
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USER: opik
      ANALYTICS_DB_PASSWORD: opik
      ANALYTICS_DB_HOST: opik-clickhouse
      ANALYTICS_DB_PORT: 8123
      REDIS_URL: redis://opik-redis:6379
    depends_on:
      - opik-clickhouse
      - opik-redis
    profiles: [opik]

  opik-worker:
    image: ghcr.io/comet-ml/opik/opik-python-backend:latest
    container_name: opik-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://opik-redis:6379
      CLICKHOUSE_URL: "http://opik:opik@opik-clickhouse:8123"
      GRPC_SERVER_PORT: 8081
    depends_on:
      - opik-backend
      - opik-clickhouse
      - opik-redis
    profiles: [opik]

  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:latest
    container_name: opik-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      OPIK_UI_OTEL_EXPORTER_OTLP_ENDPOINT: "http://opik-backend:8080"
      OPIK_UI_SERVICE_PORT: 5173
    depends_on:
      - opik-backend
    profiles: [opik]

volumes:
  model-cache:
  redis-data:
  piper-models:
  chatterbox-voices:
  caddy-data:
  opik-clickhouse:
